<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WorldAtlas Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card-stat { border: none; border-radius: 15px; transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-5px); }
        .display-4 { font-weight: bold; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="text-center mb-5 text-white">
        <h1 class="display-3">🌍 WorldAtlas</h1>
        <p class="lead">Панель администратора</p>
    </div>
    
    <div class="row mb-4 g-4">
        <div class="col-md-3">
            <div class="card card-stat text-white bg-primary shadow">
                <div class="card-body text-center">
                    <h6 class="card-title">👥 Пользователей</h6>
                    <p class="display-4 mb-0" th:text="${totalUsers}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat text-white bg-success shadow">
                <div class="card-body text-center">
                    <h6 class="card-title">👑 Админов</h6>
                    <p class="display-4 mb-0" th:text="${totalAdmins}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat text-white bg-warning shadow">
                <div class="card-body text-center">
                    <h6 class="card-title">⭐ В избранном</h6>
                    <p class="display-4 mb-0" th:text="${totalFavorites}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat text-white bg-info shadow">
                <div class="card-body text-center">
                    <h6 class="card-title">🏙️ Городов в БД</h6>
                    <p class="display-4 mb-0" th:text="${totalCities}">0</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">📋 Список пользователей</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Роль</th>
                            <th>Язык</th>
                            <th>Избранное</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td><code th:text="${user.chatId}"></code></td>
                            <td>
                                <span th:if="${user.username != 'unknown'}" th:text="'@' + ${user.username}"></span>
                                <span th:if="${user.username == 'unknown'}" class="text-muted">—</span>
                            </td>
                            <td>
                                <span th:if="${user.role.name() == 'ADMIN'}" class="badge bg-danger">👑 Админ</span>
                                <span th:if="${user.role.name() == 'USER'}" class="badge bg-secondary">👤 Пользователь</span>
                            </td>
                            <td>
                                <span th:if="${user.language == 'ru'}">🇷🇺 RU</span>
                                <span th:if="${user.language == 'en'}">🇬🇧 EN</span>
                            </td>
                            <td>
                                <span class="badge bg-primary" th:text="${user.favorites.size()}">0</span>
                            </td>
                        </tr>
                        <tr th:if="${users.isEmpty()}">
                            <td colspan="5" class="text-center text-muted py-4">Пока нет пользователей</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div class="text-center mt-4 text-white-50">
        <small>WorldAtlas Bot v75.0 • Spring Boot 3.5.14</small>
    </div>
</div>
</body>
</html>
