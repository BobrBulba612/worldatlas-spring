<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WorldAtlas Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #999999;
            --tg-theme-link-color: #007aff;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #f2f2f7;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            overscroll-behavior: none;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
        }
        
        .header {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            padding: 16px;
            text-align: center;
            flex-shrink: 0;
            position: relative;
        }
        
        .header h1 {
            font-size: clamp(16px, 4vw, 20px);
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .header p {
            font-size: clamp(12px, 3vw, 14px);
            opacity: 0.8;
        }
        
        .search-container {
            padding: 12px;
            background: var(--tg-theme-secondary-bg-color);
            flex-shrink: 0;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .results-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 12px;
        }
        
        .city-card {
            background: var(--tg-theme-bg-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(0,0,0,0.05);
        }
        
        .city-card:active {
            transform: scale(0.98);
            box-shadow: 0 1px 6px rgba(0,0,0,0.1);
        }
        
        .city-name {
            font-size: clamp(16px, 4vw, 18px);
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .city-country {
            font-size: clamp(13px, 3.5vw, 14px);
            color: var(--tg-theme-hint-color);
            margin-bottom: 8px;
        }
        
        .city-time {
            font-size: clamp(20px, 5vw, 24px);
            font-weight: 700;
            color: var(--tg-theme-button-color);
        }
        
        .city-date {
            font-size: clamp(12px, 3vw, 13px);
            color: var(--tg-theme-hint-color);
            margin-top: 4px;
        }
        
        .city-weather {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        
        .weather-temp {
            font-size: clamp(16px, 4vw, 18px);
            font-weight: 600;
        }
        
        .weather-desc {
            font-size: clamp(12px, 3vw, 13px);
            color: var(--tg-theme-hint-color);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color);
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--tg-theme-secondary-bg-color);
            border-top: 4px solid var(--tg-theme-button-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--tg-theme-hint-color);
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .error-message {
            background: #ff3b30;
            color: white;
            padding: 12px;
            border-radius: 12px;
            margin: 12px;
            text-align: center;
        }
        
        /* Планшетная версия */
        @media (min-width: 768px) {
            .results-container {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 12px;
                align-content: start;
            }
            
            .city-card {
                margin-bottom: 0;
            }
        }
        
        /* Десктопная версия */
        @media (min-width: 1024px) {
            .app-container {
                max-width: 1200px;
                margin: 0 auto;
            }
            
            .results-container {
                grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            }
        }
        
        /* Ландшафт на телефонах */
        @media (max-height: 500px) and (orientation: landscape) {
            .header {
                padding: 8px;
            }
            
            .header h1 {
                font-size: 16px;
            }
            
            .search-container {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>🌍 WorldAtlas</h1>
            <p>Время в городах мира</p>
        </div>
        
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск города..." autocomplete="off">
        </div>
        
        <div class="results-container" id="results">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Загрузка городов...</p>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        let allCities = [];
        let filteredCities = [];
        let searchTimeout = null;
        
        // Инициализация Telegram WebApp
        if (tg) {
            tg.ready();
            tg.expand();
            
            // Применяем тему
            document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#ffffff');
            document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#000000');
            document.documentElement.style.setProperty('--tg-theme-hint-color', tg.themeParams.hint_color || '#999999');
            document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#007aff');
            document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color || '#ffffff');
            document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', tg.themeParams.secondary_bg_color || '#f2f2f7');
        }
        
        // Загрузка городов
        async function loadCities() {
            try {
                const response = await fetch('/api/cities');
                if (!response.ok) throw new Error('Failed to load cities');
                allCities = await response.json();
                filteredCities = allCities;
                renderCities();
            } catch (error) {
                showError('Ошибка загрузки городов. Попробуйте позже.');
            }
        }
        
        // Поиск с дебаунсом
        document.getElementById('searchInput').addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const query = e.target.value.toLowerCase().trim();
                if (query.length === 0) {
                    filteredCities = allCities;
                } else {
                    filteredCities = allCities.filter(city => 
                        city.name.toLowerCase().includes(query) || 
                        (city.country && city.country.toLowerCase().includes(query))
                    );
                }
                renderCities();
            }, 300);
        });
        
        // Рендеринг городов
        function renderCities() {
            const results = document.getElementById('results');
            
            if (filteredCities.length === 0) {
                results.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>Города не найдены</p>
                    </div>
                `;
                return;
            }
            
            results.innerHTML = filteredCities.slice(0, 50).map(city => `
                <div class="city-card" onclick="selectCity('${city.name}')">
                    <div class="city-name">${city.name}</div>
                    <div class="city-country">${city.country || 'N/A'}</div>
                    <div class="city-time" id="time-${city.name}">--:--</div>
                    <div class="city-date" id="date-${city.name}">Загрузка...</div>
                </div>
            `).join('');
            
            // Обновляем время для каждого города
            filteredCities.slice(0, 50).forEach(city => {
                updateCityTime(city);
            });
        }
        
        // Обновление времени города
        async function updateCityTime(city) {
            try {
                const response = await fetch(`/api/cities/${encodeURIComponent(city.name)}/time`);
                if (!response.ok) throw new Error('Failed to get time');
                const data = await response.json();
                
                const timeEl = document.getElementById(`time-${city.name}`);
                const dateEl = document.getElementById(`date-${city.name}`);
                
                if (timeEl && dateEl) {
                    timeEl.textContent = data.time;
                    dateEl.textContent = data.date;
                }
            } catch (error) {
                // Тихо игнорируем ошибки времени
            }
        }
        
        // Выбор города
        function selectCity(cityName) {
            if (tg) {
                tg.sendData(JSON.stringify({ action: 'select_city', city: cityName }));
            }
        }
        
        // Показать ошибку
        function showError(message) {
            const results = document.getElementById('results');
            results.innerHTML = `
                <div class="error-message">
                    ${message}
                </div>
            `;
        }
        
        // Обновление времени каждую минуту
        setInterval(() => {
            filteredCities.slice(0, 50).forEach(city => {
                updateCityTime(city);
            });
        }, 60000);
        
        // Запуск
        loadCities();
    </script>
</body>
</html>
