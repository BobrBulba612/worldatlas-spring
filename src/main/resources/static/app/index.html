<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#1a1a2e;color:#fff;min-height:100vh}
header{background:#16213e;padding:12px;position:sticky;top:0;z-index:10}
h1{font-size:18px}
.tabs{display:flex;gap:4px;padding:8px;background:#16213e;position:sticky;top:46px;z-index:10;overflow-x:auto}
.tab{background:#0f3460;color:#e94560;padding:8px 14px;border:none;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.active{background:#e94560;color:#fff}
.page{display:none;padding:14px}
.page.active{display:block}
.card{background:#16213e;border-radius:12px;padding:14px;margin-bottom:10px}
.card h3{font-size:16px;margin-bottom:6px;color:#e94560}
.card .time{font-size:28px;font-weight:700;margin:4px 0}
.card .date{font-size:12px;color:#aaa}
input,select,textarea{width:100%;background:#0f3460;border:1px solid #0f3460;color:#fff;padding:10px;border-radius:8px;font-size:14px;margin-bottom:8px}
button{background:#e94560;color:#fff;border:none;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;width:100%}
button:active{opacity:0.7}
.msg{padding:10px;border-radius:8px;margin:8px 0;font-size:13px}
.msg.ok{background:#2d5016}
.msg.err{background:#5a1a1a}
.msg.info{background:#0f3460}
.list{margin:10px 0}
.item{background:#16213e;padding:10px;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.item .info{flex:1}
.item .actions{display:flex;gap:6px}
.btn-sm{padding:6px 10px;font-size:12px;width:auto}
.empty{color:#888;text-align:center;padding:20px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.debug{background:#0f3460;border-radius:8px;padding:10px;margin:10px 0;font-size:11px;font-family:monospace;max-height:150px;overflow-y:auto}
</style>
</head>
<body>
<header><h1>🌍 World Time Map</h1></header>
<nav class="tabs">
<button class="tab active" onclick="showPage('clocks')">🕐 Часы</button>
<button class="tab" onclick="showPage('convert')">🔁 Конвертер</button>
<button class="tab" onclick="showPage('remind')">⏰ Напоминалки</button>
<button class="tab" onclick="showPage('cities')">⭐ Города</button>
<button class="tab" onclick="showPage('support')">💬 Поддержка</button>
</nav>

<div id="debug" class="debug"></div>

<main>
<section id="page-clocks" class="page active">
<h2>🕐 Мировые часы</h2>
<div id="clocks"></div>
<button onclick="addCity()">➕ Добавить город</button>
</section>

<section id="page-convert" class="page">
<h2>🔁 Конвертер времени</h2>
<div class="card">
<label>Из города:</label>
<select id="fromCity"></select>
<label>В город:</label>
<select id="toCity"></select>
<label>Дата и время:</label>
<input type="datetime-local" id="convTime">
<button onclick="convert()">Конвертировать</button>
<div id="convResult"></div>
</div>
</section>

<section id="page-remind" class="page">
<h2>⏰ Напоминалки</h2>
<div id="remindList"></div>
<div class="card">
<h3>Создать напоминалку</h3>
<label>Город:</label>
<select id="remCity"></select>
<label>Время:</label>
<input type="time" id="remTime">
<label>Текст:</label>
<input type="text" id="remText" placeholder="Что напомнить?">
<label>Дни:</label>
<select id="remDays">
<option value="all">Каждый день</option>
<option value="weekdays">Будни</option>
<option value="weekends">Выходные</option>
</select>
<button onclick="saveRemind()">Сохранить</button>
</div>
</section>

<section id="page-cities" class="page">
<h2>⭐ Города</h2>
<div class="card">
<h3>Поиск города</h3>
<input type="text" id="searchQ" placeholder="Москва, Лондон..." oninput="search()">
<div id="searchRes"></div>
</div>
<div class="card">
<h3>Избранные</h3>
<div id="favList"></div>
</div>
<div class="card">
<h3>Мои города</h3>
<div id="customList"></div>
<button onclick="addCustom()">➕ Создать свой город</button>
</div>
</section>

<section id="page-support" class="page">
<h2>💬 Поддержка</h2>
<div class="card">
<h3>Написать в поддержку</h3>
<textarea id="supText" rows="4" placeholder="Опишите проблему..."></textarea>
<button onclick="sendSupport()">Отправить</button>
<div id="supMsg"></div>
</div>
<div class="card">
<h3>История обращений</h3>
<div id="supHistory"></div>
</div>
</section>
</main>

<script>
const tg=window.Telegram?Telegram.WebApp:null;
if(tg){tg.ready();tg.expand();}
const INIT=tg?tg.initData:'';
const DEV=new URLSearchParams(location.search).get('chatId')||'1319065617';
let S={lang:'ru',homeCity:null,favorites:[],customCities:[],reminder:null};

function log(m){const d=document.getElementById('debug');d.textContent+=new Date().toLocaleTimeString()+' '+m+'\\n';d.scrollTop=d.scrollHeight;}

async function api(p,m,b){
try{
log('→ '+p);
const o={method:m||'GET',headers:{'Content-Type':'application/json'}};
const d=Object.assign({initData:INIT,devChatId:DEV},b||{});
if(m&&m!=='GET')o.body=JSON.stringify(d);
let u='/api'+p;
if(!m||m==='GET'){const q=new URLSearchParams(d);u+='?'+q;}
const r=await fetch(u,o);
const j=await r.json();
log('← '+JSON.stringify(j).substr(0,80));
return j;
}catch(e){log('❌ '+e.message);return null;}
}

function showPage(n){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById('page-'+n).classList.add('active');
event.target.classList.add('active');
if(n==='support')loadSupport();
if(n==='remind')loadRemind();
if(n==='cities')loadCities();
if(n==='convert')loadConvert();
}

function fmtTime(tz){
const now=new Date();
return new Intl.DateTimeFormat('ru-RU',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(now);
}
function fmtDate(tz){
const now=new Date();
return new Intl.DateTimeFormat('ru-RU',{timeZone:tz,weekday:'short',day:'numeric',month:'long'}).format(now);
}

async function loadClocks(){
log('Загрузка часов...');
const r=await api('/state');
if(!r||r.error){log('❌ Ошибка: '+(r?r.error:'нет ответа'));return;}
S=r;
log('✅ Загружено: '+S.favorites.length+' избранных, '+S.customCities.length+' своих');
let h='';
if(S.homeCity)h+='<div class="card"><h3>'+S.homeCity.name+' 🏠</h3><div class="time" data-tz="'+S.homeCity.timezone+'">'+fmtTime(S.homeCity.timezone)+'</div><div class="date" data-tzd="'+S.homeCity.timezone+'">'+fmtDate(S.homeCity.timezone)+'</div></div>';
S.favorites.forEach(c=>{if(!S.homeCity||c.key!==S.homeCity.key)h+='<div class="card"><h3>'+c.name+'</h3><div class="time" data-tz="'+c.timezone+'">'+fmtTime(c.timezone)+'</div><div class="date" data-tzd="'+c.timezone+'">'+fmtDate(c.timezone)+'</div></div>';});
S.customCities.forEach(c=>{h+='<div class="card"><h3>'+c.name+' 🛠️</h3><div class="time" data-tz="'+c.timezone+'">'+fmtTime(c.timezone)+'</div><div class="date" data-tzd="'+c.timezone+'">'+fmtDate(c.timezone)+'</div></div>';});
document.getElementById('clocks').innerHTML=h||'<div class="empty">Нет городов. Добавьте через кнопку ниже.</div>';
setInterval(()=>{document.querySelectorAll('[data-tz]').forEach(e=>e.textContent=fmtTime(e.dataset.tz));document.querySelectorAll('[data-tzd]').forEach(e=>e.textContent=fmtDate(e.dataset.tzd));},1000);
}

function addCity(){
const n=prompt('Введите название города для поиска:');
if(!n)return;
api('/cities/search?q='+encodeURIComponent(n)).then(r=>{
if(!r||!r.length){alert('Город не найден');return;}
const c=r[0];
if(confirm('Добавить '+c.name+' в избранное?')){
api('/favorites/toggle','POST',{key:c.key,add:true}).then(()=>{loadClocks();alert('Добавлено!');});
}
});
}

async function loadConvert(){
const sel1=document.getElementById('fromCity');
const sel2=document.getElementById('toCity');
let opts='<option value="">-- Выберите --</option>';
const all=[...(S.homeCity?[S.homeCity]:[]),...S.favorites,...S.customCities];
all.forEach(c=>{opts+='<option value="'+c.timezone+'">'+c.name+'</option>';});
sel1.innerHTML=sel2.innerHTML=opts;
}

function convert(){
const tz1=document.getElementById('fromCity').value;
const tz2=document.getElementById('toCity').value;
const t=document.getElementById('convTime').value;
if(!tz1||!tz2||!t){alert('Заполните все поля');return;}
const [d,tm]=t.split('T');
const [y,mo,da]=d.split('-').map(Number);
const [h,mi]=tm.split(':').map(Number);
const utc=Date.UTC(y,mo-1,da,h,mi);
const off1=new Date(utc).toLocaleString('en-US',{timeZone:tz1}).split(', ')[1];
const off2=new Date(utc).toLocaleString('en-US',{timeZone:tz2}).split(', ')[1];
document.getElementById('convResult').innerHTML='<div class="msg info">Время в целевом городе: <b>'+new Date(utc).toLocaleString('ru-RU',{timeZone:tz2})+'</b></div>';
}

async function loadRemind(){
const r=await api('/state');
if(!r)return;
S=r;
const box=document.getElementById('remindList');
if(S.reminder){
box.innerHTML='<div class="card"><h3>Активная напоминалка</h3><p>🕐 '+S.reminder.time+' · '+S.reminder.city+'</p><p>📝 '+S.reminder.text+'</p><p>📅 '+S.reminder.days+'</p><button class="btn-sm" onclick="delRemind()">Удалить</button></div>';
}else box.innerHTML='<div class="empty">Нет активных напоминалок</div>';
const sel=document.getElementById('remCity');
let opts='';
[...(S.homeCity?[S.homeCity]:[]),...S.favorites,...S.customCities].forEach(c=>{opts+='<option value="'+c.key+'">'+c.name+'</option>';});
sel.innerHTML=opts;
}

function saveRemind(){
const city=document.getElementById('remCity').value;
const time=document.getElementById('remTime').value;
const text=document.getElementById('remText').value;
const days=document.getElementById('remDays').value;
if(!city||!time){alert('Заполните город и время');return;}
api('/reminders','POST',{key:city,time:time,text:text,days:days}).then(r=>{
if(r&&r.ok){alert('Сохранено!');loadRemind();}
else alert('Ошибка');
});
}

function delRemind(){
if(!confirm('Удалить напоминалку?'))return;
api('/reminders/delete','POST',{}).then(()=>{loadRemind();alert('Удалено');});
}

async function loadCities(){
const r=await api('/state');
if(!r)return;
S=r;
const fav=document.getElementById('favList');
fav.innerHTML=S.favorites.map(c=>'<div class="item"><div class="info">'+c.name+'</div><div class="actions"><button class="btn-sm" onclick="delFav(\\''+c.key+'\\')">❌</button></div></div>').join('')||'<div class="empty">Нет избранных</div>';
const cust=document.getElementById('customList');
cust.innerHTML=S.customCities.map(c=>'<div class="item"><div class="info">'+c.name+'<br><small style="color:#888">'+c.timezone+'</small></div><div class="actions"><button class="btn-sm" onclick="delCustom('+c.id+')">🗑️</button></div></div>').join('')||'<div class="empty">Нет своих городов</div>';
}

function search(){
const q=document.getElementById('searchQ').value;
if(q.length<2){document.getElementById('searchRes').innerHTML='';return;}
api('/cities/search?q='+encodeURIComponent(q)).then(r=>{
if(!r||!rЧасовой пояс (например Europe/Moscow):');
if(!tz)return;
api('/custom','POST',{name:name,timezone:tz}).then(r=>{
if(r&&r.ok){loadCities();alert('Создано!');}
else alert('Ошибка');
});
}

function delCustom(id){
if(!confirm('Удалить?'))return;
api('/custom/delete','POST',{id:id}).then(()=>{loadCities();alert('Удалено');});
}

async function loadSupport(){
const r=await api('/support');
if(!r)return;
const box=document.getElementById('supHistory');
if(!r.length){box.innerHTML='<div class="empty">Нет обращений</div>';return;}
box.innerHTML=r.map(m=>'<div class="item"><div class="info"><div style="font-size:11px;color:#888">'+new Date(m.date).toLocaleString()+'</div>'+m.text+(m.answered?'<div style="margin-top:6px;padding:6px;background:#0f3460;border-radius:6px"><b>Ответ:</b> '+m.reply+'</div>':'')+'</div></div>').join('');
}

function sendSupport(){
const t=document.getElementById('supText').value.trim();
if(!t){alert('Введите текст');return;}
api('/support','POST',{text:t}).then(r=>{
const box=document.getElementById('supMsg');
if(r&&r.ok){box.innerHTML='<div class="msg ok">✅ Сообщение отправлено!</div>';document.getElementById('supText').value='';loadSupport();}
else if(r&&r.error==='rate_limit')box.innerHTML='<div class="msg err">Не чаще 1 раза в минуту</div>';
else box.innerHTML='<div class="msg err">Ошибка отправки</div>';
});
}

log('Инициализация...');
log('initData: '+(INIT?'есть':'пусто'));
log('chatId: '+DEV);
loadClocks();
</script>
</body>
</html>
