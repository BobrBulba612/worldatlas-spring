<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Жесткий запрет кэширования -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WorldAtlas Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { font-size: 16px; opacity: 0.8; }
        .btn {
            margin-top: 20px;
            padding: 12px 24px;
            background-color: var(--tg-theme-button-color, #007aff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>✅ Мини-приложение работает!</h1>
    <p id="status">Проверка подключения...</p>
    <button class="btn" onclick="Telegram.WebApp.close()">Закрыть</button>

    <script>
        console.log("Script started");
        const tg = window.Telegram.WebApp;
        
        // Сообщаем Telegram, что приложение готово
        tg.ready();
        tg.expand(); // Разворачиваем на весь экран
        
        // Пытаемся получить данные пользователя
        const user = tg.initDataUnsafe?.user;
        const statusEl = document.getElementById('status');
        
        if (user) {
            statusEl.innerText = `Привет, ${user.first_name}! ID: ${user.id}`;
            statusEl.style.color = '#34c759'; // Зеленый цвет
            console.log("User data received:", user);
        } else {
            statusEl.innerText = "⚠️ Не удалось получить данные Telegram. Откройте через бота.";
            statusEl.style.color = '#ff3b30'; // Красный цвет
            console.log("No user data in initDataUnsafe");
        }
    </script>
</body>
</html>
