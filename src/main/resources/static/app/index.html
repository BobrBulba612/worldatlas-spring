<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WorldAtlas Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #999999;
            --tg-theme-link-color: #007aff;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #f2f2f7;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            overscroll-behavior: none;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 100%;
        }
        
        .header {
            background: linear-gradient(135deg, var(--tg-theme-button-color), #0056b3);
            color: var(--tg-theme-button-text-color);
            padding: 16px;
            text-align: center;
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .header p {
            font-size: 13px;
            opacity: 0.9;
        }
        
        .settings-bar {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: var(--tg-theme-secondary-bg-color);
            flex-shrink: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .settings-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--tg-theme-bg-color);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            border: 2px solid transparent;
        }
        
        .settings-toggle.active {
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
        }
        
        .settings-toggle:active {
            transform: scale(0.95);
        }
        
        .toggle-icon {
            font-size: 16px;
        }
        
        .search-container {
            padding: 12px;
            background: var(--tg-theme-secondary-bg-color);
            flex-shrink: 0;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .search-input::placeholder {
            color: var(--tg-theme-hint-color);
        }
        
        .results-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 12px;
        }
        
        .city-card {
            background: var(--tg-theme-bg-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(0,0,0,0.05);
        }
        
        .city-card:active {
            transform: scale(0.98);
            box-shadow: 0 1px 6px rgba(0,0,0,0.1);
        }
        
        .city-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        
        .city-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        
        .city-country {
            font-size: 13px;
            color: var(--tg-theme-hint-color);
        }
        
        .city-time-block {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        
        .city-time {
            font-size: 28px;
            font-weight: 700;
            color: var(--tg-theme-button-color);
            line-height: 1;
        }
        
        .city-date {
            font-size: 13px;
            color: var(--tg-theme-hint-color);
            margin-top: 4px;
        }
        
        .home-diff {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 6px 10px;
            background: rgba(0,122,255,0.1);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--tg-theme-button-color);
        }
        
        .weather-block {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding: 8px;
            background: rgba(0,0,0,0.03);
            border-radius: 8px;
        }
        
        .weather-icon {
            font-size: 24px;
        }
        
        .weather-info {
            flex: 1;
        }
        
        .weather-temp {
            font-size: 18px;
            font-weight: 600;
        }
        
        .weather-desc {
            font-size: 12px;
            color: var(--tg-theme-hint-color);
        }
        
        .sunrise-sunset {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            padding: 8px;
            background: rgba(255,193,7,0.1);
            border-radius: 8px;
            font-size: 12px;
        }
        
        .sun-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color);
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--tg-theme-secondary-bg-color);
            border-top: 4px solid var(--tg-theme-button-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--tg-theme-hint-color);
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .error-message {
            background: #ff3b30;
            color: white;
            padding: 12px;
            border-radius: 12px;
            margin: 12px;
            text-align: center;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--tg-theme-hint-color);
            margin: 16px 0 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Tablet */
        @media (min-width: 768px) {
            .results-container {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 12px;
                align-content: start;
            }
            
            .city-card {
                margin-bottom: 0;
            }
        }
        
        /* Desktop */
        @media (min-width: 1024px) {
            .app-container {
                max-width: 1200px;
                margin: 0 auto;
            }
            
            .results-container {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }
        
        /* Landscape mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .header {
                padding: 8px;
            }
            
            .header h1 {
                font-size: 16px;
            }
            
            .search-container, .settings-bar {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>🌍 WorldAtlas</h1>
            <p>Время в городах мира</p>
        </div>
        
        <div class="settings-bar">
            <div class="settings-toggle active" id="toggleHome" onclick="toggleSetting('homeCompare')">
                <span class="toggle-icon"></span>
                <span>Дом</span>
            </div>
            <div class="settings-toggle active" id="toggleWeather" onclick="toggleSetting('weather')">
                <span class="toggle-icon">🌤️</span>
                <span>Погода</span>
            </div>
            <div class="settings-toggle active" id="toggleSunrise" onclick="toggleSetting('sunrise')">
                <span class="toggle-icon">🌅</span>
                <span>Восход</span>
            </div>
        </div>
        
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск города..." autocomplete="off">
        </div>
        
        <div class="results-container" id="results">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Загрузка...</p>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        let userState = {};
        let searchTimeout = null;
        let selectedCities = [];
        
        // Инициализация
        if (tg) {
            tg.ready();
            tg.expand();
            applyTheme();
        }
        
        function applyTheme() {
            if (tg?.themeParams) {
                document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#ffffff');
                document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#000000');
                document.documentElement.style.setProperty('--tg-theme-hint-color', tg.themeParams.hint_color || '#999999');
                document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#007aff');
                document.docums.button_text_color || '#ffffff');
                document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', tg.themeParams.secondary_bg_color || '#f2f2f7');
            }
        }
        
        // Загрузка состояния пользователя
        async function loadUserState() {
            try {
                const params = new URLSearchParams();
                if (tg?.initData) params.append('initData', tg.initData);
                
                const response = await fetch(`/api/state?${params}`);
                if (!response.ok) throw new Error('Failed to load state');
                
                userState = await response.json();
                if (userState.error === 'unauthorized') {
                    showError('Ошибка авторизации. Перезапустите бота.');
                    return;
                }
                
                updateSettingsUI();
                await loadCities();
            } catch (error) {
                console.error('Load state error:', error);
                showError('Ошибка загрузки. Попробуйте позже.');
            }
        }
        
        // Обновление UI настроек
        function updateSettingsUI() {
            document.getElementById('toggleHome').classList.toggle('active', userState.showHomeComparison !== false);
            document.getElementById('toggleWeather').classList.toggle('active', userState.showWeather !== false);
            document.getElementById('toggleSunrise').classList.toggle('active', userState.showSunriseSunset !== false);
        }
        
        // Переключение настройки
        async function toggleSetting(setting) {
            const toggles = {
                'homeCompare': 'showHomeComparison',
                'weather': 'showWeather',
                'sunrise': 'showSunriseSunset'
            };
            
            const key = toggles[setting];
            if (!key) return;
            
            const newValue = !userState[key];
            userState[key] = newValue;
            updateSettingsUI();
            
            try {
                const params = new URLSearchParams();
                if (tg?.initData) params.append('initData', tg.initData);
                
                await fetch(`/api/settings/${key}?value=${newValue}&${params}`, {
                    method: 'POST'
                });
                
                // Обновляем отображение городов
                if (selectedCities.length > 0) {
                    renderCities();
                }
            } catch (error) {
                console.error('Toggle error:', error);
                userState[key] = !newValue;
                updateSettingsUI();
            }
        }
        
        // Загрузка городов (популярные или поиск)
        async function loadCities(query = '') {
            try {
                const params = new URLSearchParams();
                if (query) params.append('q', query);
                if (tg?.initData) params.append('initData', tg.initData);
                
                const response = await fetch(`/api/cities/search?${params}`);
                if (!response.ok) throw new Error('Search failed');
                
                const cities = await response.json();
                selectedCities = cities.slice(0, 20);
                renderCities();
            } catch (error) {
                console.error('Load cities error:', error);
                showError('Ошибка загрузки городов.');
            }
        }
        
        // Рендеринг городов
        function renderCities() {
            const results = document.getElementById('results');
            
            if (selectedCities.length === 0) {
                results.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>Города не найдены</p>
                        <p style="margin-top: 8px; font-size: 13px;">Введите название города для поиска</p>
                    </div>
                `;
                return;
            }
            
            results.innerHTML = selectedCities.map(city => createCityCard(city)).join('');
            
            // Обновляем время для каждого города
            selectedCities.forEach(city => updateCityInfo(city));
        }
        
        // Создание карточки города
        function createCityCard(city) {
            const showHome = userState.showHomeComparison !== false && userState.homeCity;
            const showWeather = userState.showWeather !== false;
            const showSunrise = userState.showSunriseSunset !== false;
            
            let html = `
                <div class="city-card" onclick="selectCity('${city.key}')">
                    <div class="city-header">
                        <div>
                            <div class="city-name">${city.name}</div>
                            <div class="city-country">${city.country || city.timezone || ''}</div>
                        </div>
                    </div>
                    <div class="city-time-block">
                        <div class="city-time" id="time-${city.key}">--:--</div>
                        <div class="city-date" id="date-${city.key}">Загрузка...</div>
            `;
            
            // Разница с домашним городом
            if (showHome && userState.homeCity && userState.homeCity.key !== city.key) {
                html += `
                    <div class="home-diff" id="diff-${city.key}">
                        <span></span>
                        <span>Загрузка...</span>
                    </div>
                `;
            }
            
            // Погода
            if (showWeather) {
                html += `
                    <div class="weather-block" id="weather-${city.key}">
                        <span class="weather-icon">⏳</span>
                        <div class="weather-info">
                            <div class="weather-temp">Загрузка...</div>
                            <div class="weather-desc">Погода</div>
                        </div>
                    </div>
                `;
            }
            
            // Восход/Закат
            if (showSunrise) {
                html += `
                    <div class="sunrise-sunset" id="sun-${city.key}">
                        <div class="sun-item">
                            <span>🌅</span>
                            <span id="sunrise-${city.key}">--:--</span>
                        </div>
                        <div class="sun-item">
                            <span>🌇</span>
                            <span id="sunset-${city.key}">--:--</span>
                        </div>
                    </div>
                `;
            }
            
            html += `
                    </div>
                </div>
            `;
            
            return html;
        }
        
        // Обновление информации о городе
        async function updateCityInfo(city) {
            try {
                const params = new URLSearchParams();
                if (tg?.initData) params.append('initData', tg.initData);
                
                const response                if (timeEl && dateEl) {
                    timeEl.textContent = data.currentTime;
                    dateEl.textContent = formatDate(data.currentDate, data.dayOfWeek);
                }
                
                // Разница с домом
                if (userState.showHomeComparison !== false && userState.homeCity && userState.homeCity.key !== city.key) {
                    await updateTimeDiff(city.key);
                }
                
                // Погода
                if (userState.showWeather !== false && data.weather) {
                    updateWeather(city.key, data.weather);
                }
                
                // Восход/Закат
                if (userState.showSunriseSunset !== false && data.sunrise && data.sunset) {
                    const sunriseEl = document.getElementById(`sunrise-${city.key}`);
                    const sunsetEl = document.getElementById(`sunset-${city.key}`);
                    if (sunriseEl) sunriseEl.textContent = data.sunrise;
                    if (sunsetEl) sunsetEl.textContent = data.sunset;
                }
            } catch (error) {
                console.error('Update city info error:', error);
            }
        }
        
        // Обновление разницы во времени
        async function updateTimeDiff(cityKey) {
            try {
                if (!userState.homeCity) return;
                
                const params = new URLSearchParams();
                if (tg?.initData) params.append('initData', tg.initData);
                
                const response = await fetch(`/api/diff?city1=${encodeURIComponent(cityKey)}&city2=${encodeURIComponent(userState.homeCity.key)}&${params}`);
                if (!response.ok) return;
                
                const data = await response.json();
                if (!data.ok) return;
                
                const diffEl = document.getElementById(`diff-${cityKey}`);
                if (diffEl) {
                    const sign = data.diff.startsWith('+') ? '' : '';
                    diffEl.innerHTML = `<span>🏠</span><span>${sign}${data.diff} от дома</span>`;
                }
            } catch (error) {
                console.error('Time diff error:', error);
            }
        }
        
        // Обновление погоды
        function updateWeather(cityKey, weather) {
            const weatherEl = document.getElementById(`weather-${cityKey}`);
            if (!weatherEl) return;
            
            const icon = getWeatherIcon(weather.description);
            const tempEl = weatherEl.querySelector('.weather-temp');
            const descEl = weatherEl.querySelector('.weather-desc');
            
            if (tempEl) tempEl.textContent = `${Math.round(weather.temp)}°C`;
            if (descEl) descEl.textContent = weather.description;
        }
        
        // Иконка погоды
        function getWeatherIcon(desc) {
            const d = desc.toLowerCase();
            if (d.includes('rain')) return '🌧️';
            if (d.includes('cloud')) return '☁️';
            if (d.includes('sun') || d.includes('clear')) return '☀️';
            if (d.includes('snow')) return '❄️';
            return '🌤️';
        }
        
        // Форматирование даты
        function formatDate(dateStr, dayOfWeek) {
            const days = {
                'MONDAY': 'пн', 'TUESDAY': 'вт', 'WEDNESDAY': 'ср',
                'THURSD: 'фев', '03': 'мар', '04': 'апр',
                '05': 'май', '06': 'июн', '07': 'июл', '08': 'авг',
                '09': 'сен', '10': 'окт', '11': 'ноя', '12': 'дек'
            };
            
            const [year, month, day] = dateStr.split('-');
            const dayName = days[dayOfWeek] || '';
            const monthName = months[month] || month;
            
            return `${dayName}, ${day} ${monthName} ${year}`;
        }
        
        // Поиск с дебаунсом
        document.getElementById('searchInput').addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const query = e.target.value.trim();
                if (query.length >= 2) {
                    loadCities(query);
                } else if (query.length === 0) {
                    loadCities('');
                }
            }, 300);
        });
        
        // Выбор города
        function selectCity(cityName) {
            if (tg) {
                tg.sendData(JSON.stringify({ action: 'select_city', city: cityName }));
            }
        }
        
        // Показать ошибку
        function showError(message) {
            const results = document.getElementById('results');
            results.innerHTML = `<div class="error-message">${message}</div>`;
        }
        
        // Запуск
        loadUserState();
        
        // Обновление времени каждую минуту
        setInterval(() => {
            selectedCities.forEach(city => updateCityInfo(city));
        }, 60000);
    </script>
</body>
</html>
