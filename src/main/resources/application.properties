# Telegram Bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:WorldTimeMapBot}

# Mini App URL
webapp.url=${WEBAPP_URL:}

# Прокси (опционально — для локальной разработки если нужен)
proxy.host=${PROXY_HOST:}
proxy.port=${PROXY_PORT:0}

# База данных
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/botdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.h2.console.enabled=false

# Web server
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
