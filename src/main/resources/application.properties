# ==================== TELEGRAM ====================
telegram.bot.username=WorldAtlasMap_bot
telegram.bot.token=REMOVED_BOT_TOKEN

# ==================== БАЗА ДАННЫХ ====================
spring.datasource.url=jdbc:h2:file:./bot_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Консоль H2 (для отладки БД по адресу /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================== ВЕБ-СЕРВЕР ====================
server.port=8080
spring.thymeleaf.cache=false

# ==================== ЛОГИ ====================
logging.level.root=INFO
logging.level.com.worldatlas=INFO
logging.level.org.telegram=INFO