# Telegram Bot - читаем из переменных окружения
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:WorldTimeMapBot}

# Mini App URL (публичный адрес)
webapp.url=${WEBAPP_URL:}

# База данных - используем файл (для persistence на Render)
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/botdb};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Web server
server.port=${PORT:8080}

# Для Render нужен health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
