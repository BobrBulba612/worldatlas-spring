# Sentry configuration
# DSN будет установлен через переменную окружения SENTRY_DSN на Render
# dsn=https://your-dsn@sentry.io/project-id

# Отправляем 100% ошибок в продакшене
traces-sample-rate=1.0

# Автоматически отслеживаем Spring Boot
stacktrace.app-packages=com.worldatlas.bot

# Логируем в Sentry
logging.minimum-event-level=error
logging.minimum-breadcrumb-level=info
